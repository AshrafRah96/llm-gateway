port 0
tls-port 6379
tls-cert-file /run/secrets/ledger_certificate
tls-key-file /run/secrets/ledger_private_key
tls-ca-cert-file /run/secrets/redis_ca
tls-auth-clients no
aclfile /run/secrets/ledger_acl
bind 0.0.0.0
protected-mode yes
dir /data
appendonly yes
appendfsync always
save 300 1
stop-writes-on-bgsave-error yes
maxmemory 256mb
maxmemory-policy noeviction
