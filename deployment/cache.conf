port 0
tls-port 6379
tls-cert-file /run/secrets/cache_certificate
tls-key-file /run/secrets/cache_private_key
tls-ca-cert-file /run/secrets/redis_ca
tls-auth-clients no
aclfile /run/secrets/cache_acl
bind 0.0.0.0
protected-mode yes
dir /data
appendonly yes
appendfsync everysec
save 300 1
maxmemory 384mb
maxmemory-policy noeviction
