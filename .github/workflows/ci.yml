name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Several tests skip themselves when no Redis is reachable. Running one here
      # means they actually execute in CI rather than quietly passing as skips.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Confirm the Redis-backed tests ran
        # A skipped test proves nothing. If the Redis service failed to come up, the
        # suite would still be green, so fail loudly instead.
        run: |
          if go test -v -count=1 ./internal/ratelimit/ ./internal/auth/ ./internal/usage/ | grep -q "^--- SKIP"; then
            echo "Redis-backed tests were skipped; the service is not reachable"
            exit 1
          fi
